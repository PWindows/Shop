<div class="menu-overlay" id="mobileMenu" aria-hidden="true" inert>
  <nav class="nav-menu" aria-label="Site menu">
    {% for item in site.data.site.navigation %}
    <a href="{{ site.data.site.main_url }}{{ item.path }}" class="nav-item btn">
      <img class="nav-item-icon" src="{{ item.icon | relative_url }}" alt="" aria-hidden="true" />
      {{ item.label }}
    </a>
    {% endfor %}

    <button class="nav-item btn btn-gold nav-bottom" type="button" disabled>
      <img class="nav-item-icon" src="{{ '/assets/mojang/svg/icons/what-block.svg' | relative_url }}" alt="" aria-hidden="true" />
      Join Server
    </button>
    <button class="nav-item btn btn-green" type="button" disabled>
      <img class="nav-item-icon" src="{{ '/assets/mojang/svg/icons/color-grass-block.png' | relative_url }}" alt="" aria-hidden="true" />
      Launch Minecraft Bedrock
    </button>

    <div class="menu-footer">
      <p>Connect with PWindows</p>
      <div class="social-links">
        <a href="{{ site.data.site.links.discord }}" class="social-link no-icon" aria-label="PWindows on Discord">
          <img class="social-link-img" src="{{ '/assets/mojang/svg/icons/discord.png' | relative_url }}" alt="" />
        </a>
        <a href="{{ site.data.site.links.youtube }}" class="social-link no-icon" aria-label="PWindows on YouTube">
          <img class="social-link-img" src="{{ '/assets/mojang/svg/icons/color-youtube.svg' | relative_url }}" alt="" />
        </a>
        <a href="{{ site.data.site.links.twitter }}" class="social-link no-icon" aria-label="PWindows on Twitter">
          <img class="social-link-img social-link-img--compact" src="{{ '/assets/mojang/svg/icons/color-twitter.svg' | relative_url }}" alt="" />
        </a>
      </div>
    </div>
  </nav>
</div>

<nav class="topbar" aria-label="Primary navigation">
  <button class="hamburger" id="hamburger" type="button" aria-label="Open site menu" aria-controls="mobileMenu" aria-expanded="false">
    <span class="hamburger-lines" aria-hidden="true"><span></span><span></span><span></span></span>
  </button>

  <a class="logo" href="{{ '/' | relative_url }}" aria-label="PWindows Shop home">
    <img src="{{ '/assets/PWindows.png' | relative_url }}" alt="PWindows" class="logo-img" />
  </a>

  <button class="cart-btn launch-btn-top btn btn-green" id="cart-btn" type="button" aria-label="Open shopping cart" aria-controls="cart-sidebar" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 2a1 1 0 0 0-1 1v1H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-4V3a1 1 0 1 0-2 0v1h-4V3a1 1 0 0 0-1-1Zm7 4h4v14H4V6h4v1a1 1 0 0 0 2 0V6h4v1a1 1 0 1 0 2 0V6Z" fill="currentColor" />
    </svg>
    <span class="cart-label">Cart</span>
    <span class="cart-count" id="cart-count" hidden>0</span>
  </button>
</nav>

<div class="cart-overlay" id="cart-overlay" aria-hidden="true"></div>
<aside class="cart-sidebar" id="cart-sidebar" aria-labelledby="cart-heading" aria-hidden="true" inert>
  <div class="cart-header">
    <h2 id="cart-heading">Shopping Cart</h2>
    <button class="cart-close btn" id="cart-close" type="button" aria-label="Close shopping cart">&times;</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-promo">
      <label class="sr-only" for="cart-promo-input">Promo code</label>
      <input type="text" id="cart-promo-input" class="cart-promo-input" placeholder="Promo code..." />
      <button class="cart-promo-btn btn" id="cart-promo-btn" type="button">Apply</button>
    </div>
    <p class="cart-promo-msg" id="cart-promo-msg" aria-live="polite"></p>
    <div class="cart-totals">
      <div class="cart-subtotal"><span>Subtotal:</span><span id="cart-subtotal">$0.00</span></div>
      <div class="cart-discount" id="cart-discount-row" hidden><span>Discount:</span><span id="cart-discount">-$0.00</span></div>
      <div class="cart-total"><span>Total:</span><span id="cart-total">$0.00</span></div>
    </div>
    <button class="cart-checkout-btn btn btn-green" id="cart-checkout-btn" type="button">Proceed to Checkout</button>
  </div>
</aside>
