<!-- Floating particles -->
<div class="particles" id="particles"></div>

<!-- Mobile Menu Overlay -->
<div class="menu-overlay" id="mobileMenu">
    <nav class="nav-menu">
        <a href="https://www.pwindows.qzz.io" class="nav-item">Back to main site</a>
    </nav>
    
    <div class="menu-footer">
        <p>Connect with PWindows</p>
        <div class="social-links">
            <a href="#" class="social-link" title="Discord">💬</a>
            <a href="#" class="social-link" title="YouTube">📺</a>
            <a href="#" class="social-link" title="Twitter">🐦</a>
        </div>
    </div>
</div>

<!-- Topbar -->
<nav class="topbar">
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="logo" id="logo" onclick="goHome()">
        <img src="https://shop.pwindows.qzz.io/assets/PWindows.png" alt="PWindows Logo" class="logo-img">
    </div>

    <button class="cart-btn" id="cart-btn" onclick="toggleCart()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 2C8.44772 2 8 2.44772 8 3V4H4C2.89543 4 2 4.89543 2 6V20C2 21.1046 2.89543 22 4 22H20C21.1046 22 22 21.1046 22 20V6C22 4.89543 21.1046 4 20 4H16V3C16 2.44772 15.5523 2 15 2C14.4477 2 14 2.44772 14 3V4H10V3C10 2.44772 9.55228 2 9 2ZM16 6H10V7C10 7.55228 9.55228 8 9 8C8.44772 8 8 7.55228 8 7V6H4V20H20V6H16V7C16 7.55228 15.5523 8 15 8C14.4477 8 14 7.55228 14 7V6Z" fill="currentColor"/>
        </svg>
        <span class="cart-count" id="cart-count" style="display:none;">0</span>
    </button>
</nav>

<!-- Shopping Cart Sidebar -->
<div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
        <h2>Shopping Cart</h2>
        <button class="cart-close" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
        <div class="cart-promo">
            <input type="text" id="cart-promo-input" class="cart-promo-input" placeholder="Promo code..." />
            <button class="cart-promo-btn" onclick="applyPromoToCart()">Apply</button>
        </div>
        <p class="cart-promo-msg" id="cart-promo-msg"></p>
        <div class="cart-totals">
            <div class="cart-subtotal">
                <span>Subtotal:</span>
                <span id="cart-subtotal">$0.00</span>
            </div>
            <div class="cart-discount" id="cart-discount-row" style="display:none;">
                <span>Discount:</span>
                <span id="cart-discount">-$0.00</span>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
        </div>
        <button class="cart-checkout-btn" id="cart-checkout-btn" onclick="checkoutFromCart()">Proceed to Checkout</button>
    </div>
</div>
