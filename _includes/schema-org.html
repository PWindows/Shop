<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "OnlineStore",
    "name": {{ site.title | jsonify }},
    "description": {{ site.description | jsonify }},
    "url": {{ site.url | jsonify }},
    "logo": {{ '/assets/PWindows.png' | absolute_url | jsonify }},
    "parentOrganization": {
      "@type": "Organization",
      "name": "PWindows",
      "url": {{ site.data.site.main_url | jsonify }}
    }
  }
</script>
